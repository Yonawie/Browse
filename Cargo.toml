[workspace]
resolver = "2"
members = [
  "crates/core-types",
  "crates/policy",
  "crates/page-intelligence",
  "crates/memory",
  "crates/engine-adapter",
  "crates/model-gateway",
  "crates/agent-runtime",
  "crates/engine-cdp",
  "crates/fixtures",
  "apps/desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/bert/browse"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
rusqlite = { version = "0.40", features = ["bundled"] }
url = "2"
blake3 = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "process", "net", "io-util", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
base64 = "0.22"
tempfile = "3"
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
which = "8"

core-types = { path = "crates/core-types" }
policy = { path = "crates/policy" }
page-intelligence = { path = "crates/page-intelligence" }
memory = { path = "crates/memory" }
engine-adapter = { path = "crates/engine-adapter" }
model-gateway = { path = "crates/model-gateway" }
agent-runtime = { path = "crates/agent-runtime" }
engine-cdp = { path = "crates/engine-cdp" }
fixtures = { path = "crates/fixtures" }

[profile.release]
lto = "thin"
codegen-units = 1
