[package]
name = "memory"
description = "Local memory store: SQLite (+ FTS5, sqlite-vec) with hybrid search, knowledge graph, agent journal."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
core-types = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[features]
default = []
# Load the sqlite-vec extension and use the vec0 virtual table instead of the
# brute-force fallback. Requires the extension binary at runtime.
sqlite-vec = ["rusqlite/load_extension"]
